services:
  app:
    image: "${APP_IMAGE:-song-cards:local}"
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - song-cards-db:/data/db
      - song-cards-media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  owntone-init:
    image: docker.io/library/busybox:1.37
    profiles:
      - airplay
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/config", "/cache"]
    volumes:
      - owntone-config:/config
      - owntone-cache:/cache
    restart: "no"

  owntone:
    image: docker.io/owntone/owntone:29.1
    profiles:
      - airplay
    network_mode: host
    restart: unless-stopped
    depends_on:
      owntone-init:
        condition: service_completed_successfully
    environment:
      UID: "1000"
      GID: "1000"
    tmpfs:
      - /run
    volumes:
      - owntone-config:/etc/owntone
      - owntone-cache:/var/cache/owntone
      - song-cards-media:/srv/media:ro

volumes:
  song-cards-db:
  song-cards-media:
  owntone-config:
  owntone-cache:
